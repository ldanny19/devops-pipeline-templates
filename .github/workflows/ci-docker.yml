name: CI DOCKER

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Directorio del modulo Java'
        required: true
        type: string
      docker_image:
        description: 'Nombre de imagen GHCR sin registry ni owner'
        required: true
        type: string
      build_tool:
        description: 'Herramienta de construccion: maven o gradle'
        required: false
        type: string
        default: 'maven'
      docker_context:
        description: 'Contexto de construccion relativo a la raiz del repositorio'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Dockerfile relativo a la raiz; vacio usa modulo/Dockerfile'
        required: false
        type: string
        default: ''
      image_tag:
        description: 'Etiqueta de imagen; vacio usa el SHA del commit'
        required: false
        type: string
        default: ''
    outputs:
      image:
        description: 'Referencia completa de imagen publicada'
        value: ${{ jobs.docker.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Construir, escanear y publicar imagen
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Descargar artefacto generado por CI JAVA BUILD
        uses: actions/download-artifact@v4
        with:
          name: paquete-api
          path: ${{ inputs.working_directory }}/${{ inputs.build_tool == 'maven' && 'target' || 'build/libs' }}

      - name: Validar contexto, Dockerfile y artefacto
        id: image
        shell: bash
        env:
          MODULE: ${{ inputs.working_directory }}
          BUILD_TOOL: ${{ inputs.build_tool }}
          DOCKER_CONTEXT: ${{ inputs.docker_context }}
          DOCKERFILE_INPUT: ${{ inputs.dockerfile }}
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          DOCKERFILE="$DOCKERFILE_INPUT"
          if [[ -z "$DOCKERFILE" ]]; then
            DOCKERFILE="$MODULE/Dockerfile"
          fi
          case "$BUILD_TOOL" in
            maven) ARTIFACT="$MODULE/target/paquete-api.jar" ;;
            gradle) ARTIFACT="$MODULE/build/libs/paquete-api.jar" ;;
            *)
              echo "::error::Herramienta no soportada: $BUILD_TOOL"
              exit 1
              ;;
          esac
          [[ -d "$DOCKER_CONTEXT" ]] || {
            echo "::error::No existe el contexto Docker: $DOCKER_CONTEXT"
            exit 1
          }
          [[ -f "$DOCKERFILE" ]] || {
            echo "::error::No existe el Dockerfile: $DOCKERFILE"
            exit 1
          }
          [[ -s "$ARTIFACT" ]] || {
            echo "::error::No existe el JAR esperado en $ARTIFACT"
            exit 1
          }
          if grep -Eiq '^[[:space:]]*RUN[[:space:]].*(mvn|gradle|mvnw|gradlew)' "$DOCKERFILE"; then
            echo "::error::El Dockerfile no debe compilar; debe incorporar el JAR generado por CI JAVA BUILD."
            exit 1
          fi
          if [[ ! "$DOCKER_IMAGE" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::docker_image debe contener solo caracteres validos en minusculas."
            exit 1
          fi
          IMAGE_TAG="$IMAGE_TAG_INPUT"
          if [[ -z "$IMAGE_TAG" ]]; then IMAGE_TAG="$GITHUB_SHA"; fi
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::image_tag no es una etiqueta Docker valida."
            exit 1
          fi
          IMAGE="ghcr.io/${{ github.repository_owner }}/$DOCKER_IMAGE:$IMAGE_TAG"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker sin publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ steps.image.outputs.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen verificada
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
