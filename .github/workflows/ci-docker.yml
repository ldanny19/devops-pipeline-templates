name: CI DOCKER

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Directorio del modulo Java'
        required: true
        type: string
      docker_image:
        description: 'Nombre de imagen GHCR sin registry ni owner'
        required: true
        type: string
      artifact_file_name:
        description: 'Nombre original del JAR generado en CI JAVA BUILD'
        required: true
        type: string
      artifact_directory:
        description: 'Directorio nativo del JAR relativo al modulo'
        required: true
        type: string
      artifact_path:
        description: 'Ruta original del JAR relativa al modulo'
        required: true
        type: string
      docker_context:
        description: 'Contexto de construccion relativo a la raiz del repositorio'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Dockerfile relativo a la raiz; vacio usa modulo/Dockerfile'
        required: false
        type: string
        default: ''
      image_tag:
        description: 'Etiqueta de imagen; vacio usa el SHA del commit'
        required: false
        type: string
        default: ''
      artifact_name:
        description: 'Nombre del artefacto Actions generado por BUILD'
        required: false
        type: string
        default: 'java-build-artifact'
    outputs:
      image:
        description: 'Referencia completa de imagen publicada'
        value: ${{ jobs.docker.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Construir, escanear y publicar imagen
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Descargar JAR original de CI JAVA BUILD
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/${{ inputs.artifact_directory }}

      - name: Validar contexto, Dockerfile y JAR
        id: image
        shell: bash
        env:
          MODULE: ${{ inputs.working_directory }}
          ARTIFACT_FILE_NAME: ${{ inputs.artifact_file_name }}
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
          DOCKER_CONTEXT: ${{ inputs.docker_context }}
          DOCKERFILE_INPUT: ${{ inputs.dockerfile }}
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          DOCKERFILE="$DOCKERFILE_INPUT"
          if [[ -z "$DOCKERFILE" ]]; then
            DOCKERFILE="$MODULE/Dockerfile"
          fi

          [[ -d "$DOCKER_CONTEXT" ]] || {
            echo "::error::No existe el contexto Docker: $DOCKER_CONTEXT"
            exit 1
          }
          [[ -f "$DOCKERFILE" ]] || {
            echo "::error::No existe el Dockerfile: $DOCKERFILE"
            exit 1
          }

          if [[ "$ARTIFACT_PATH" = /* || "$ARTIFACT_PATH" == *".."* ]]; then
            echo "::error::La ruta del artefacto debe ser relativa al modulo y segura."
            exit 1
          fi
          ARTIFACT="$MODULE/$ARTIFACT_PATH"
          [[ -s "$ARTIFACT" ]] || {
            echo "::error::No se encontro el JAR original: $ARTIFACT"
            exit 1
          }
          [[ "$(basename "$ARTIFACT")" == "$ARTIFACT_FILE_NAME" ]] || {
            echo "::error::El nombre del JAR descargado no coincide con el output de BUILD."
            exit 1
          }

          JAR_FILE="$(realpath --relative-to="$DOCKER_CONTEXT" "$ARTIFACT")"
          if [[ "$JAR_FILE" == ../* || "$JAR_FILE" == ".." ]]; then
            echo "::error::El JAR debe estar dentro del contexto Docker."
            exit 1
          fi

          if grep -Eiq '^[[:space:]]*RUN[[:space:]].*(mvn|gradle|mvnw|gradlew)' "$DOCKERFILE"; then
            echo "::error::El Dockerfile no debe compilar; debe incorporar el JAR generado por CI JAVA BUILD."
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*ARG[[:space:]]+JAR_FILE([=[:space:]]|$)' "$DOCKERFILE" ||
             ! grep -Eq '^[[:space:]]*ARG[[:space:]]+JAR_FILE_NAME([=[:space:]]|$)' "$DOCKERFILE" ||
             ! grep -Eq '^[[:space:]]*COPY[[:space:]].*JAR_FILE' "$DOCKERFILE"; then
            echo "::error::El Dockerfile debe declarar ARG JAR_FILE y ARG JAR_FILE_NAME y utilizar JAR_FILE en COPY para conservar el nombre versionado."
            exit 1
          fi

          if [[ ! "$DOCKER_IMAGE" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::docker_image debe contener solo caracteres validos en minusculas."
            exit 1
          fi
          IMAGE_TAG="$IMAGE_TAG_INPUT"
          if [[ -z "$IMAGE_TAG" ]]; then IMAGE_TAG="$GITHUB_SHA"; fi
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::image_tag no es una etiqueta Docker valida."
            exit 1
          fi

          IMAGE="ghcr.io/${{ github.repository_owner }}/$DOCKER_IMAGE:$IMAGE_TAG"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "jar_file=$JAR_FILE" >> "$GITHUB_OUTPUT"
          echo "jar_file_name=$ARTIFACT_FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "Docker recibira el JAR original: $JAR_FILE"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker sin publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ steps.image.outputs.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.image.outputs.image }}
          build-args: |
            JAR_FILE=${{ steps.image.outputs.jar_file }}
            JAR_FILE_NAME=${{ steps.image.outputs.jar_file_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen verificada
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
