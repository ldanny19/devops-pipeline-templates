
name: CI DOCKER

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Directorio del modulo Java'
        required: true
        type: string

      docker_image:
        description: 'Nombre de la imagen Docker'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Descargar artefacto generado por CI JAVA BUILD
        uses: actions/download-artifact@v4
        with:
          name: paquete-api
          path: ${{ inputs.working_directory }}/dist

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Obtener version del proyecto
        id: version
        shell: bash
        run: |
          set -euo pipefail

          echo "version=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Construir imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working_directory }}
          file: ${{ inputs.working_directory }}/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.docker_image }}:${{ steps.version.outputs.version }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working_directory }}
          file: ${{ inputs.working_directory }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.docker_image }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
