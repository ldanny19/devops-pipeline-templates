name: CD DEPLOY

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      docker_image:
        description: 'Referencia completa de imagen, incluyendo tag'
        required: true
        type: string
      deploy_path:
        description: 'Directorio remoto que contiene compose.yaml'
        required: true
        type: string
      compose_service:
        description: 'Servicio exacto de Docker Compose que se debe desplegar'
        required: true
        type: string
      ssh_port:
        required: false
        type: number
        default: 22
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KNOWN_HOSTS:
        required: true
      GHCR_USERNAME:
        required: true
      GHCR_TOKEN:
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.deploy_path }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar y verificar
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Configurar SSH y verificar host
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Autenticar servidor en GHCR
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ inputs.ssh_port }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Desplegar imagen
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ inputs.ssh_port }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          COMPOSE_SERVICE: ${{ inputs.compose_service }}
          IMAGE: ${{ inputs.docker_image }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "::error::docker_image debe ser una referencia completa de GHCR con tag."
            exit 1
          }
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != *".."* ]] || {
            echo "::error::deploy_path debe ser una ruta absoluta segura."
            exit 1
          }
          [[ "$COMPOSE_SERVICE" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]*$ ]] || {
            echo "::error::compose_service debe ser un nombre de servicio Docker Compose valido."
            exit 1
          }
          printf -v REMOTE_PATH '%q' "$DEPLOY_PATH"
          printf -v REMOTE_IMAGE '%q' "$IMAGE"
          printf -v REMOTE_SERVICE '%q' "$COMPOSE_SERVICE"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- $REMOTE_PATH $REMOTE_IMAGE $REMOTE_SERVICE" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"
          IMAGE="$2"
          COMPOSE_SERVICE="$3"
          [[ -d "$DEPLOY_PATH" ]] || {
            echo "No existe el directorio de despliegue: $DEPLOY_PATH"
            exit 1
          }
          cd "$DEPLOY_PATH"
          [[ -f compose.yaml || -f compose.yml || -f docker-compose.yml ]] || {
            echo "No se encontro archivo Compose."
            exit 1
          }
          export IMAGE
          docker compose config --quiet
          docker compose pull "$COMPOSE_SERVICE"
          docker compose up -d --no-build --no-deps "$COMPOSE_SERVICE"
          RUNNING_CONTAINERS="$(docker compose ps --status running --quiet "$COMPOSE_SERVICE")"
          [[ -n "$RUNNING_CONTAINERS" ]] || {
            echo "El servicio $COMPOSE_SERVICE no quedo en estado running."
            docker compose ps --all "$COMPOSE_SERVICE"
            exit 1
          }
          docker compose ps --all "$COMPOSE_SERVICE"
          REMOTE
