name: CI JAVA

on:
  workflow_call:
    inputs:
      java_version:
        required: true
        type: string
      java_distribution:
        required: true
        type: string
      build_tool:
        required: true
        type: string
      build_tool_version:
        required: true
        type: string
      working_directory:
        required: true
        type: string
      execute_build:
        description: 'Ejecutar compilacion y pruebas'
        required: false
        type: boolean
        default: true
      execute_docker:
        description: 'Construir y publicar imagen Docker'
        required: false
        type: boolean
        default: false
      docker_image:
        description: 'Nombre de imagen GHCR sin registry ni owner'
        required: false
        type: string
        default: ''
      artifact_file:
        description: 'Ruta relativa al modulo para seleccionar el JAR principal; vacio para deteccion automatica'
        required: false
        type: string
        default: ''
      publish_artifact:
        description: 'Publicar el artefacto generado'
        required: false
        type: boolean
        default: true
      artifact_name:
        description: 'Nombre unico del artefacto Actions publicado'
        required: false
        type: string
        default: 'java-build-artifact'
      dependency_artifact_name:
        description: 'Artefacto Actions de una dependencia Maven local'
        required: false
        type: string
        default: ''
      dependency_group_id:
        required: false
        type: string
        default: ''
      dependency_artifact_id:
        required: false
        type: string
        default: ''
      dependency_version:
        required: false
        type: string
        default: ''
      docker_context:
        description: 'Contexto Docker relativo a la raiz del repositorio'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Dockerfile relativo a la raiz; vacio usa modulo/Dockerfile'
        required: false
        type: string
        default: ''
      image_tag:
        description: 'Etiqueta de imagen; vacio usa el SHA del commit'
        required: false
        type: string
        default: ''
    outputs:
      image:
        description: 'Referencia inmutable de la imagen publicada'
        value: ${{ jobs.docker.outputs.image }}
      artifact_file_name:
        description: 'Nombre original del artefacto generado'
        value: ${{ jobs.build.outputs.artifact_file_name }}
      artifact_directory:
        description: 'Directorio nativo del artefacto relativo al modulo'
        value: ${{ jobs.build.outputs.artifact_directory }}
      artifact_path:
        description: 'Ruta original del artefacto relativa al modulo'
        value: ${{ jobs.build.outputs.artifact_path }}

permissions:
  contents: read

jobs:
  validate:
    name: Validar opciones del pipeline
    runs-on: ubuntu-24.04
    steps:
      - name: Validar combinacion de etapas
        shell: bash
        env:
          EXECUTE_BUILD: ${{ inputs.execute_build }}
          EXECUTE_DOCKER: ${{ inputs.execute_docker }}
          PUBLISH_ARTIFACT: ${{ inputs.publish_artifact }}
          DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          set -euo pipefail
          if [[ "$EXECUTE_DOCKER" == "true" && "$EXECUTE_BUILD" != "true" ]]; then
            echo "::error::Docker requiere ejecutar CI JAVA BUILD."
            exit 1
          fi
          if [[ "$EXECUTE_DOCKER" == "true" && "$PUBLISH_ARTIFACT" != "true" ]]; then
            echo "::error::Docker requiere publicar el artefacto generado por BUILD."
            exit 1
          fi
          if [[ "$EXECUTE_DOCKER" == "true" && -z "$DOCKER_IMAGE" ]]; then
            echo "::error::docker_image es obligatorio cuando execute_docker=true."
            exit 1
          fi

  test:
    name: CI JAVA TEST
    needs: validate
    uses: ldanny19/devops-pipeline-templates/.github/workflows/ci-java-test.yml@d4f8834fd81ecd551571b996a1d5d398c5f04fbe
    with:
      java_version: ${{ inputs.java_version }}
      java_distribution: ${{ inputs.java_distribution }}
      build_tool: ${{ inputs.build_tool }}
      build_tool_version: ${{ inputs.build_tool_version }}
      working_directory: ${{ inputs.working_directory }}

  build:
    name: CI JAVA BUILD
    if: ${{ inputs.execute_build }}
    needs: test
    uses: ldanny19/devops-pipeline-templates/.github/workflows/ci-java-build.yml@a2c593f430b3418950d81cad77e01bec0552cf93
    with:
      java_version: ${{ inputs.java_version }}
      java_distribution: ${{ inputs.java_distribution }}
      build_tool: ${{ inputs.build_tool }}
      build_tool_version: ${{ inputs.build_tool_version }}
      working_directory: ${{ inputs.working_directory }}
      artifact_file: ${{ inputs.artifact_file }}
      publish_artifact: ${{ inputs.publish_artifact }}
      artifact_name: ${{ inputs.artifact_name }}
      dependency_artifact_name: ${{ inputs.dependency_artifact_name }}
      dependency_group_id: ${{ inputs.dependency_group_id }}
      dependency_artifact_id: ${{ inputs.dependency_artifact_id }}
      dependency_version: ${{ inputs.dependency_version }}

  docker:
    name: CI DOCKER
    if: ${{ inputs.execute_docker }}
    needs:
      - validate
      - build
    permissions:
      contents: read
      packages: write
    uses: ldanny19/devops-pipeline-templates/.github/workflows/ci-docker.yml@1a5374cb6f0f26acde40ad41ac2e796334c881e4
    with:
      working_directory: ${{ inputs.working_directory }}
      docker_image: ${{ inputs.docker_image }}
      artifact_file_name: ${{ needs.build.outputs.artifact_file_name }}
      artifact_directory: ${{ needs.build.outputs.artifact_directory }}
      artifact_path: ${{ needs.build.outputs.artifact_path }}
      docker_context: ${{ inputs.docker_context }}
      dockerfile: ${{ inputs.dockerfile }}
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
