name: CI JAVA BUILD

on:
  workflow_call:
    inputs:
      java_version:
        required: true
        type: string
      java_distribution:
        required: true
        type: string
      build_tool:
        required: true
        type: string
      build_tool_version:
        required: true
        type: string
      working_directory:
        required: true
        type: string
      artifact_file:
        description: 'Ruta relativa al modulo para seleccionar el JAR principal; vacio para deteccion automatica'
        required: false
        type: string
        default: ''
      publish_artifact:
        description: 'Publicar el artefacto generado'
        required: false
        type: boolean
        default: true
      artifact_name:
        description: 'Nombre unico del artefacto Actions publicado'
        required: false
        type: string
        default: 'java-build-artifact'
      dependency_artifact_name:
        description: 'Artefacto Actions de una dependencia Maven local'
        required: false
        type: string
        default: ''
      dependency_group_id:
        required: false
        type: string
        default: ''
      dependency_artifact_id:
        required: false
        type: string
        default: ''
      dependency_version:
        required: false
        type: string
        default: ''
    outputs:
      artifact_file_name:
        description: 'Nombre original del JAR generado por Maven o Gradle'
        value: ${{ jobs.build.outputs.artifact_file_name }}
      artifact_directory:
        description: 'Directorio nativo relativo al modulo: target o build/libs'
        value: ${{ jobs.build.outputs.artifact_directory }}
      artifact_path:
        description: 'Ruta relativa al modulo, conservando nombre y directorio originales'
        value: ${{ jobs.build.outputs.artifact_path }}

permissions:
  contents: read

jobs:
  build:
    name: Compilar, probar y publicar artefacto
    runs-on: ubuntu-24.04
    outputs:
      artifact_file_name: ${{ steps.artifact.outputs.artifact_file_name }}
      artifact_directory: ${{ steps.artifact.outputs.artifact_directory }}
      artifact_path: ${{ steps.artifact.outputs.artifact_path }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}
          cache: ${{ inputs.build_tool }}

      - name: Configurar Maven
        if: ${{ inputs.build_tool == 'maven' }}
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: ${{ inputs.build_tool_version }}

      - name: Configurar Gradle
        if: ${{ inputs.build_tool == 'gradle' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.build_tool_version }}

      - name: Descargar dependencia Maven del mismo workflow
        if: ${{ inputs.build_tool == 'maven' && inputs.dependency_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dependency_artifact_name }}
          path: .ci-dependencies

      - name: Instalar dependencia Maven local
        if: ${{ inputs.build_tool == 'maven' && inputs.dependency_artifact_name != '' }}
        shell: bash
        env:
          GROUP_ID: ${{ inputs.dependency_group_id }}
          ARTIFACT_ID: ${{ inputs.dependency_artifact_id }}
          VERSION: ${{ inputs.dependency_version }}
        run: |
          set -euo pipefail
          JAR_FILE="$(find .ci-dependencies -maxdepth 2 -type f -name '*.jar' -print -quit)"
          [[ -n "$JAR_FILE" && -s "$JAR_FILE" ]] || {
            echo "::error::No se encontro el JAR de la dependencia descargada."
            exit 1
          }
          [[ -n "$GROUP_ID" && -n "$ARTIFACT_ID" && -n "$VERSION" ]] || {
            echo "::error::Faltan las coordenadas Maven de la dependencia local."
            exit 1
          }
          mvn -B --no-transfer-progress install:install-file \
            -Dfile="$JAR_FILE" \
            -DgroupId="$GROUP_ID" \
            -DartifactId="$ARTIFACT_ID" \
            -Dversion="$VERSION" \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Compilar y ejecutar pruebas
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          BUILD_TOOL: ${{ inputs.build_tool }}
        run: |
          set -euo pipefail
          case "$BUILD_TOOL" in
            maven) mvn -B --no-transfer-progress clean verify ;;
            gradle) gradle clean build --no-daemon ;;
            *)
              echo "::error::Herramienta no soportada: $BUILD_TOOL"
              exit 1
              ;;
          esac

      - name: Identificar JAR principal sin renombrarlo
        if: ${{ inputs.publish_artifact }}
        id: artifact
        shell: bash
        env:
          MODULE: ${{ inputs.working_directory }}
          BUILD_TOOL: ${{ inputs.build_tool }}
          ARTIFACT_FILE: ${{ inputs.artifact_file }}
        run: |
          set -euo pipefail

          case "$BUILD_TOOL" in
            maven) OUTPUT_DIR="target" ;;
            gradle) OUTPUT_DIR="build/libs" ;;
            *)
              echo "::error::Herramienta no soportada: $BUILD_TOOL"
              exit 1
              ;;
          esac

          if [[ -n "$ARTIFACT_FILE" ]]; then
            if [[ "$ARTIFACT_FILE" = /* || "$ARTIFACT_FILE" == *".."* ]]; then
              echo "::error::artifact_file debe ser una ruta relativa dentro del modulo."
              exit 1
            fi
            SOURCE="$MODULE/$ARTIFACT_FILE"
            [[ -f "$SOURCE" ]] || {
              echo "::error::No existe el artefacto indicado: $SOURCE"
              exit 1
            }
            RELATIVE_PATH="$ARTIFACT_FILE"
            RELATIVE_DIRECTORY="$(dirname "$RELATIVE_PATH")"
          else
            JARS=()
            while IFS= read -r -d '' FILE; do
              JARS+=("$FILE")
            done < <(find "$MODULE/$OUTPUT_DIR" -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
              ! -name '*-tests.jar' ! -name '*-plain.jar' \
              ! -name 'original-*' -print0)

            if [[ "${#JARS[@]}" -ne 1 ]]; then
              echo "::error::Se esperaba exactamente un JAR principal en $MODULE/$OUTPUT_DIR y se encontraron ${#JARS[@]}. Configure artifact_file para seleccionar el artefacto correcto."
              printf '%s\\n' "${JARS[@]}"
              exit 1
            fi
            SOURCE="${JARS[0]}"
            RELATIVE_PATH="$OUTPUT_DIR/$(basename "$SOURCE")"
            RELATIVE_DIRECTORY="$OUTPUT_DIR"
          fi

          [[ -s "$SOURCE" ]] || {
            echo "::error::El JAR seleccionado esta vacio: $SOURCE"
            exit 1
          }

          echo "artifact_file_name=$(basename "$SOURCE")" >> "$GITHUB_OUTPUT"
          echo "artifact_directory=$RELATIVE_DIRECTORY" >> "$GITHUB_OUTPUT"
          echo "artifact_path=$RELATIVE_PATH" >> "$GITHUB_OUTPUT"
          echo "JAR identificado: $RELATIVE_PATH"

      - name: Publicar JAR conservando nombre y estructura
        if: ${{ inputs.publish_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7
