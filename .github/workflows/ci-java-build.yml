name: CI JAVA BUILD

on:
  workflow_call:
    inputs:
      java_version:
        required: true
        type: string
      java_distribution:
        required: true
        type: string
      build_tool:
        required: true
        type: string
      build_tool_version:
        required: true
        type: string
      working_directory:
        required: true
        type: string
      artifact_file:
        description: 'JAR relativo al modulo; vacio para deteccion automatica'
        required: false
        type: string
        default: ''
      publish_artifact:
        description: 'Publicar el artefacto generado'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Compilar, probar y empaquetar
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}
          cache: ${{ inputs.build_tool }}

      - name: Configurar Maven
        if: ${{ inputs.build_tool == 'maven' }}
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: ${{ inputs.build_tool_version }}

      - name: Configurar Gradle
        if: ${{ inputs.build_tool == 'gradle' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.build_tool_version }}

      - name: Compilar y ejecutar pruebas
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          BUILD_TOOL: ${{ inputs.build_tool }}
        run: |
          set -euo pipefail
          case "$BUILD_TOOL" in
            maven) mvn -B --no-transfer-progress clean verify ;;
            gradle) gradle clean build --no-daemon ;;
            *)
              echo "::error::Herramienta no soportada: $BUILD_TOOL"
              exit 1
              ;;
          esac

      - name: Preparar artefacto JAR
        if: ${{ inputs.publish_artifact }}
        shell: bash
        env:
          MODULE: ${{ inputs.working_directory }}
          ARTIFACT_FILE: ${{ inputs.artifact_file }}
        run: |
          set -euo pipefail
          mkdir -p "$MODULE/dist"

          if [[ -n "$ARTIFACT_FILE" ]]; then
            if [[ "$ARTIFACT_FILE" = /* || "$ARTIFACT_FILE" == *".."* ]]; then
              echo "::error::artifact_file debe ser una ruta relativa dentro del modulo."
              exit 1
            fi
            SOURCE="$MODULE/$ARTIFACT_FILE"
            [[ -f "$SOURCE" ]] || {
              echo "::error::No existe el artefacto indicado: $SOURCE"
              exit 1
            }
          else
            JARS=()
            for OUTPUT_DIR in "$MODULE/target" "$MODULE/build/libs"; do
              if [[ -d "$OUTPUT_DIR" ]]; then
                while IFS= read -r -d '' FILE; do
                  JARS+=("$FILE")
                done < <(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.jar' \
                  ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
                  ! -name 'original-*' -print0)
              fi
            done
            if [[ "${#JARS[@]}" -ne 1 ]]; then
              echo "::error::Se esperaba exactamente un JAR principal y se encontraron ${#JARS[@]}. Configure artifact_file."
              printf '%s\n' "${JARS[@]}"
              exit 1
            fi
            SOURCE="${JARS[0]}"
          fi

          cp "$SOURCE" "$MODULE/dist/paquete-api.jar"
          echo "Artefacto preparado: $MODULE/dist/paquete-api.jar"

      - name: Publicar artefacto
        if: ${{ inputs.publish_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: paquete-api
          path: ${{ inputs.working_directory }}/dist/paquete-api.jar
          if-no-files-found: error
          retention-days: 7
